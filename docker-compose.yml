services:
  postgres:
    image: postgres:17
    container_name: smarthunt-postgres
    restart: always
    network_mode: host
    environment:
      - POSTGRES_DB=smarthunt
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:8
    container_name: smarthunt-valkey
    restart: always
    network_mode: host

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smarthunt-backend-app
    restart: always
    # Matches how postgres/valkey are actually deployed on this host (see
    # `docker inspect smarthunt-postgres` — they run with --network host,
    # not the compose bridge network below), so .env's `localhost` URLs
    # resolve correctly with no per-service overrides needed. Port mapping
    # doesn't apply under host networking; the container binds :8000 directly.
    network_mode: host
    depends_on:
      - postgres
      - valkey
    env_file:
      - .env
      - /home/badr/secrets/secret.env
    environment:
      - RESUME_STORAGE_DIR=/data/resumes
      - BROWSER_PROFILES_DIR=/data/browser-profiles
    volumes:
      - resume_storage:/data/resumes
      - browser_profiles:/data/browser-profiles

volumes:
  postgres_data:
  resume_storage:
  browser_profiles:
