apiVersion: v1
kind: ConfigMap

metadata:
  name: smarthunt-config
  labels:
    app: smarthunt
    component: backend

data:

  APP_NAME: "SmartHunt"

  APP_ENV: "production"

  APP_DEBUG: "false"

  LOG_LEVEL: "INFO"

  HOST: "0.0.0.0"

  PORT: "8000"

  DATABASE_ECHO: "false"

  JWT_ALGORITHM: "HS256"

  ACCESS_TOKEN_EXPIRE_MINUTES: "60"

  TZ: "UTC"

  RESUME_STORAGE_DIR: "/data/resumes"
  BROWSER_PROFILES_DIR: "/data/browser-profiles"

  # In-cluster Service DNS name of the postgresql-persistent template's
  # Service (see k8s/DISASTER_RECOVERY.md) — found live on the cluster
  # 2026-08-12 but missing from this file (drift: live configmap had 13
  # keys, this file only had 12), so a `oc apply -f` of this file alone
  # would have silently dropped it from a real deployment.
  POSTGRES_HOST: "smarthunt-postgres-internal"
