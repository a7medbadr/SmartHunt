apiVersion: apps/v1
kind: Deployment
metadata:
  name: smarthunt-backend
  labels:
    app: smarthunt
    component: backend
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: smarthunt
      component: backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: smarthunt
        component: backend
    spec:
      containers:
      - name: backend
        image: image-registry.openshift-image-registry.svc:5000/a-badr-dev/smarthunt-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          protocol: TCP
        envFrom:
        - configMapRef:
            name: smarthunt-config
        - secretRef:
            name: smarthunt-secret
        resources:
          # 512Mi was nowhere near enough — found 2026-08-04 live: a real
          # LinkedIn feed scan (which launches an actual headless
          # Chromium, same as login()/apply()) OOMKilled the pod
          # (exitCode 137) every time, which is what every "حصل خطأ أثناء
          # الفحص" report on OpenShift actually was — the backend crashed
          # mid-request, not a code bug in the scan logic itself.
          #
          # 2Gi still wasn't enough on its own — found 2026-08-06 via
          # `oc describe pod` showing Restart Count: 3, Last State:
          # OOMKilled, each crash landing within ~2 minutes of
          # `scheduler_started`. Root cause: SchedulerService's own
          # startup catch-up (services/scheduler_service.py) used to fire
          # every overdue job as a separate concurrent asyncio.create_task
          # — on a restart where e.g. both discover_linux and
          # discover_vmware were overdue (routine), two full discovery
          # passes (each fanning out across ~11 providers, several
          # driving real Chromium) ran fully concurrently seconds after
          # boot, and every restart re-triggered the same overdue jobs
          # again — a genuine crash loop. Fixed in code
          # (_run_catchup_jobs_sequentially runs due jobs one at a time
          # instead of all at once), but bumping the ceiling here too as
          # real safety margin — a single discovery pass plus the
          # periodic browser recycle/session-healthcheck jobs still add
          # up to more than the old 2Gi comfortably allows. Ample quota
          # headroom available (compute-deploy: 30Gi limit).
          requests:
            cpu: 200m
            memory: 768Mi
          limits:
            cpu: "1"
            memory: 3Gi
        volumeMounts:
        - name: resume-storage
          mountPath: /data/resumes
        - name: browser-profiles
          mountPath: /data/browser-profiles
        livenessProbe:
          httpGet:
            path: /api/v1/health/live
            port: 8000
          initialDelaySeconds: 20
          timeoutSeconds: 2
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v1/health/ready
            port: 8000
          initialDelaySeconds: 10
          timeoutSeconds: 2
          periodSeconds: 5
        startupProbe:
          httpGet:
            path: /api/v1/health/live
            port: 8000
          failureThreshold: 30
          periodSeconds: 5
      volumes:
      - name: resume-storage
        persistentVolumeClaim:
          claimName: smarthunt-resume-storage
      - name: browser-profiles
        persistentVolumeClaim:
          claimName: smarthunt-browser-profiles
