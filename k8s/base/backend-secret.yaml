# SECURITY: this file is committed to git and must NEVER hold real
# secret values — found 2026-08-07 during a full audit that it had for
# some time (real, live values on the OpenShift cluster matched these
# exact placeholder strings verbatim, meaning the deployed app's
# JWT-signing key was a string sitting in plaintext in this public repo
# history — a full remote authentication-bypass: anyone who read this
# file could forge a valid JWT for the live app). Settings.model_post_init
# only checks these are non-empty in production, not that they differ
# from a known-insecure default, so nothing else catches this.
#
# Apply for real with `oc create secret generic smarthunt-secret
# --from-literal=DATABASE_URL=... --from-literal=SECRET_KEY=$(python3 -c
# "import secrets; print(secrets.token_urlsafe(48))") --from-literal=...`
# (or `oc set data secret/smarthunt-secret --from-literal=...` to rotate
# an existing one) — never by applying this file with real values filled
# in, and never by committing the real values here.
apiVersion: v1
kind: Secret
metadata:
  name: smarthunt-secret
type: Opaque
stringData:
  DATABASE_URL: "CHANGE_ME_set_via_oc_create_secret_not_git"
  # Found live on the cluster 2026-08-12 but missing from this template
  # (drift: live secret had 5 keys, this file only had 4 — a `oc create
  # secret` from this file alone would've silently dropped it): neither
  # REDIS_URL nor VALKEY_URL actually resolves to a real deployed
  # service on OpenShift — there is no valkey/redis Deployment in this
  # project at all, unlike local dev's docker-compose valkey container.
  # Left as-is (matches the live cluster) rather than guessed-fixed;
  # decide whether to deploy a real valkey here or confirm the app
  # degrades gracefully without one before relying on this in production.
  REDIS_URL: "redis://smarthunt-redis:6379/0"
  VALKEY_URL: "redis://valkey:6379/0"
  SECRET_KEY: "CHANGE_ME_set_via_oc_create_secret_not_git"
  JWT_SECRET_KEY: "CHANGE_ME_set_via_oc_create_secret_not_git"
