apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: smarthunt-frontend
  labels:
    app: smarthunt
    component: frontend

spec:
  runPolicy: Serial

  source:
    type: Binary

  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: frontend/Dockerfile
      buildArgs:
        # The in-cluster Service DNS name for the backend — see
        # frontend/Dockerfile's comment on why this must be a build ARG,
        # not just the runtime configmap's BACKEND_ORIGIN.
        - name: BACKEND_ORIGIN
          value: http://smarthunt-backend

  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: "1"
      memory: 1Gi

  output:
    to:
      kind: ImageStreamTag
      name: smarthunt-frontend:latest
